<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">One Durable Copy</title>
<desc id="d">The application writes to a PostgreSQL disc, which is backed up nightly, and to a file store drawn with a dashed red outline because it is lost on every restart.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
<rect width="800" height="400" fill="#F2EFE6"/>
<text x="40" y="42" font-size="15" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="3">ONE DURABLE COPY</text>
<text x="760" y="42" font-size="12" font-weight="500" text-anchor="end" fill="#111111" letter-spacing="1.5">FIG. 5A</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#111111" stroke-width="3" stroke-linecap="butt"/>
<rect x="50" y="150" width="160" height="80" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="130" y="186" font-size="11" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.5">APPLICATION</text>
<text x="130" y="204" font-size="10.5" font-weight="400" text-anchor="middle" fill="#F2EFE6" letter-spacing="0.3">gami-webapp</text>
<line x1="216" y1="172" x2="344" y2="136" stroke="#111111" stroke-width="4" marker-end="url(#ak)"/>
<circle cx="400" cy="128" r="50" fill="#2E7D4F" stroke="#111111" stroke-width="4"/>
<text x="400" y="126" font-size="10" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.2">POSTGRESQL</text>
<text x="400" y="142" font-size="10" font-weight="400" text-anchor="middle" fill="#F2EFE6" letter-spacing="0.3">system of record</text>
<line x1="456" y1="128" x2="594" y2="128" stroke="#111111" stroke-width="4" marker-end="url(#ak)"/>
<rect x="600" y="98" width="150" height="60" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="4"/>
<text x="675" y="124" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">NIGHTLY BACKUP</text>
<text x="675" y="142" font-size="10.5" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">restore not tested</text>
<line x1="216" y1="208" x2="344" y2="258" stroke="#111111" stroke-width="4" marker-end="url(#ak)"/>
<rect x="350" y="236" width="120" height="60" rx="6" fill="none" stroke="#D7261E" stroke-width="3" stroke-dasharray="8 7"/>
<text x="410" y="262" font-size="10.5" font-weight="700" text-anchor="middle" fill="#D7261E" letter-spacing="1.2">FILE STORE</text>
<text x="410" y="279" font-size="10.5" font-weight="400" text-anchor="middle" fill="#D7261E" letter-spacing="0.3">lost on restart</text>
<text x="490" y="262" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Not persisted in production.</text>
<text x="490" y="279" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Staging keeps it.</text>
<circle cx="56" cy="322" r="7" fill="#111111"/>
<text x="74" y="326" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Bitcoin holds only a batch root. A lost record cannot be rebuilt from it.</text>
<line x1="40" y1="350" x2="760" y2="350" stroke="#111111" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="376" font-size="13" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">The production database and its nightly backup are the only copies of the records.</text>
</svg>
