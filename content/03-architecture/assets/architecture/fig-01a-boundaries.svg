<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">What Crosses Each Boundary</title>
<desc id="d">An institution box holding a file and a key, a hosted services box and an anchors box in a row. A dashed red line beside the institution marks where files and keys stop. Arrows carry hashes and metadata to the hosted services and a batch root on to the anchors. A verifier below sends only a hash.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
<rect width="800" height="420" fill="#F2EFE6"/>
<text x="40" y="42" font-size="15" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="3">WHAT CROSSES EACH BOUNDARY</text>
<text x="760" y="42" font-size="12" font-weight="500" text-anchor="end" fill="#111111" letter-spacing="1.5">FIG. 1A</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#111111" stroke-width="3" stroke-linecap="butt"/>
<rect x="40" y="100" width="160" height="120" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="4"/>
<text x="120" y="124" font-size="11" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">INSTITUTION</text>
<rect x="66" y="142" width="40" height="40" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="3"/>
<circle cx="160" cy="162" r="16" fill="#F4D35E" stroke="#111111" stroke-width="3"/>
<text x="86" y="202" font-size="9.5" font-weight="500" text-anchor="middle" fill="#111111" letter-spacing="1.5">FILE</text>
<text x="160" y="202" font-size="9.5" font-weight="500" text-anchor="middle" fill="#111111" letter-spacing="1.5">KEY</text>
<line x1="228" y1="90" x2="228" y2="230" stroke="#D7261E" stroke-width="4" stroke-dasharray="8 7"/>
<text x="228" y="250" font-size="10" font-weight="700" text-anchor="middle" fill="#D7261E" letter-spacing="1.5">FILES AND KEYS STOP HERE</text>
<line x1="206" y1="160" x2="394" y2="160" stroke="#111111" stroke-width="4" marker-end="url(#ak)"/>
<text x="240" y="148" font-size="10" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="1.5">HASHES, METADATA</text>
<text x="240" y="180" font-size="10.5" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">and one signed assertion</text>
<rect x="400" y="100" width="160" height="120" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="480" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.5">HOSTED SERVICES</text>
<text x="480" y="174" font-size="10.5" font-weight="400" text-anchor="middle" fill="#F2EFE6" letter-spacing="0.3">portal, verifier, seal</text>
<line x1="566" y1="160" x2="644" y2="160" stroke="#111111" stroke-width="4" marker-end="url(#ak)"/>
<text x="605" y="148" font-size="9" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="0.8">BATCH ROOT</text>
<rect x="650" y="100" width="110" height="120" rx="6" fill="#2E7D4F" stroke="#111111" stroke-width="4"/>
<text x="705" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.5">ANCHORS</text>
<text x="705" y="174" font-size="10.5" font-weight="400" text-anchor="middle" fill="#F2EFE6" letter-spacing="0.3">time evidence</text>
<circle cx="480" cy="318" r="24" fill="#F2EFE6" stroke="#111111" stroke-width="4"/>
<line x1="480" y1="290" x2="480" y2="228" stroke="#111111" stroke-width="4" marker-end="url(#ak)"/>
<text x="444" y="322" font-size="10.5" font-weight="700" text-anchor="end" fill="#111111" letter-spacing="1.5">VERIFIER</text>
<text x="516" y="306" font-size="10" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="1.5">64-CHARACTER HASH</text>
<text x="516" y="322" font-size="10.5" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">the checked file stays on the device</text>
<line x1="40" y1="370" x2="760" y2="370" stroke="#111111" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="396" font-size="13" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Hashes, chosen metadata and one batch root travel. Files and private keys never do.</text>
</svg>
