<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">Vocabulary Layers</title>
<desc id="d">Three stacked bands, bottom to top: PROV-O, then PREMIS 3 and Dublin Core, then the opr namespace. A dashed box at the side holds C2PA, which is not a layer.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
<rect width="800" height="400" fill="#F2EFE6"/>
<text x="40" y="42" font-size="15" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="3">VOCABULARY LAYERS</text>
<text x="760" y="42" font-size="12" font-weight="500" text-anchor="end" fill="#111111" letter-spacing="1.5">FIG. 4A</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#111111" stroke-width="3" stroke-linecap="butt"/>
<line x1="84" y1="284" x2="84" y2="96" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<rect x="150" y="92" width="410" height="56" rx="6" fill="#D7261E" stroke="#111111" stroke-width="4"/>
<text x="168" y="116" font-size="12" font-weight="700" text-anchor="start" fill="#F2EFE6" letter-spacing="1.5">OPR:</text>
<text x="168" y="134" font-size="11" font-weight="400" text-anchor="start" fill="#F2EFE6" letter-spacing="0.3">record, proof, commitment, anchor</text>
<text x="124" y="127" font-size="18" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">3</text>
<rect x="150" y="160" width="410" height="56" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="168" y="184" font-size="12" font-weight="700" text-anchor="start" fill="#F2EFE6" letter-spacing="1.5">PREMIS 3 AND DUBLIN CORE</text>
<text x="168" y="202" font-size="11" font-weight="400" text-anchor="start" fill="#F2EFE6" letter-spacing="0.3">file, event, fixity, identifier, collection</text>
<text x="124" y="195" font-size="18" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">2</text>
<rect x="150" y="228" width="410" height="56" rx="6" fill="#111111" stroke="#111111" stroke-width="4"/>
<text x="168" y="252" font-size="12" font-weight="700" text-anchor="start" fill="#F2EFE6" letter-spacing="1.5">PROV-O</text>
<text x="168" y="270" font-size="11" font-weight="400" text-anchor="start" fill="#F2EFE6" letter-spacing="0.3">entity, activity, agent</text>
<text x="124" y="263" font-size="18" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">1</text>
<rect x="610" y="160" width="150" height="56" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="3" stroke-dasharray="8 6"/>
<text x="685" y="184" font-size="12" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">C2PA</text>
<text x="685" y="202" font-size="11" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">not a layer</text>
<text x="610" y="240" font-size="10.5" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">A manifest is evidence</text>
<text x="610" y="256" font-size="10.5" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">a record may cite by hash.</text>
<text x="150" y="316" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Verification works on the JSON bytes and does not depend on JSON-LD processing.</text>
<line x1="40" y1="350" x2="760" y2="350" stroke="#111111" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="376" font-size="13" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Borrowed terms carry the meaning. The opr: namespace adds only four of its own.</text>
</svg>
