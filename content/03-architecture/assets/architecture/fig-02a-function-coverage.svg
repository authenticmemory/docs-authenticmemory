<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">Nine Functions, Forty Sub-Functions</title>
<desc id="d">Nine rows, one per function, each with one small square per sub-function: green for implemented, blue for partial, a dashed red outline for not in code. Totals at the right: 9 implemented, 20 partial, 11 not in code.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
