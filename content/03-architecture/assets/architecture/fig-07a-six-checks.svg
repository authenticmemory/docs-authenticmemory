<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">Six Checks In Order</title>
<desc id="d">Six numbered discs joined by arrows: file hash, Merkle path, signature, key history, stamping path, block header. Four are blue and need only the file and the record. Key history is red and needs the institution's domain. Block header is green and needs Bitcoin headers.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
<rect width="800" height="400" fill="#F2EFE6"/>
<text x="40" y="42" font-size="15" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="3">SIX CHECKS IN ORDER</text>
<text x="760" y="42" font-size="12" font-weight="500" text-anchor="end" fill="#111111" letter-spacing="1.5">FIG. 7A</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#111111" stroke-width="3" stroke-linecap="butt"/>
<line x1="116" y1="150" x2="186" y2="150" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<circle cx="90" cy="150" r="22" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="90" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="0">1</text>
<text x="90" y="198" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">FILE HASH</text>
<text x="90" y="214" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">equals the record's</text>
<line x1="240" y1="150" x2="310" y2="150" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<circle cx="214" cy="150" r="22" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="214" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="0">2</text>
<text x="214" y="198" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">MERKLE PATH</text>
<text x="214" y="214" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">leaf to signing root</text>
<line x1="364" y1="150" x2="434" y2="150" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<circle cx="338" cy="150" r="22" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="338" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="0">3</text>
<text x="338" y="198" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">SIGNATURE</text>
<text x="338" y="214" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">Ed25519 on the root</text>
<line x1="488" y1="150" x2="558" y2="150" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<circle cx="462" cy="150" r="22" fill="#D7261E" stroke="#111111" stroke-width="4"/>
<text x="462" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="0">4</text>
<text x="462" y="198" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">KEY HISTORY</text>
<text x="462" y="214" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">from the DID log</text>
<line x1="612" y1="150" x2="682" y2="150" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<circle cx="586" cy="150" r="22" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="586" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="0">5</text>
<text x="586" y="198" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">STAMPING PATH</text>
<text x="586" y="214" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">to the anchored root</text>
<circle cx="710" cy="150" r="22" fill="#2E7D4F" stroke="#111111" stroke-width="4"/>
<text x="710" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="0">6</text>
<text x="710" y="198" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">BLOCK HEADER</text>
<text x="710" y="214" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">holds the root</text>
<text x="40" y="264" font-size="11" font-weight="400" text-anchor="start" fill="#D7261E" letter-spacing="0.3">Today the top-level result ignores check 4: a retired key can still show as valid (risk T-02).</text>
<circle cx="48" cy="322" r="7" fill="#1F4E9C" stroke="#111111" stroke-width="2"/>
<text x="64" y="326" font-size="9.5" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="1.2">FILE AND RECORD ONLY</text>
<circle cx="290" cy="322" r="7" fill="#D7261E" stroke="#111111" stroke-width="2"/>
<text x="306" y="326" font-size="9.5" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="1.2">INSTITUTION'S DOMAIN</text>
<circle cx="540" cy="322" r="7" fill="#2E7D4F" stroke="#111111" stroke-width="2"/>
<text x="556" y="326" font-size="9.5" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="1.2">BITCOIN HEADERS</text>
<line x1="40" y1="350" x2="760" y2="350" stroke="#111111" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="376" font-size="13" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Six checks, the same in the hosted verifier and in the independent command-line tool.</text>
</svg>
