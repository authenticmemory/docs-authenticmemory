<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">The Life Of A Record</title>
<desc id="d">Four discs joined by arrows: unsigned, signed, stamped, upgraded. From upgraded, four arrows lead to dashed boxes for states that are not built: dual-anchored, renewed, replaced and withdrawn.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
<rect width="800" height="400" fill="#F2EFE6"/>
<text x="40" y="42" font-size="15" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="3">THE LIFE OF A RECORD</text>
<text x="760" y="42" font-size="12" font-weight="500" text-anchor="end" fill="#111111" letter-spacing="1.5">FIG. 8A</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#111111" stroke-width="3" stroke-linecap="butt"/>
<line x1="116" y1="180" x2="202" y2="180" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<text x="160" y="164" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">ONE TOUCH</text>
<line x1="256" y1="180" x2="342" y2="180" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<text x="300" y="164" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">SECONDS</text>
<line x1="396" y1="180" x2="482" y2="180" stroke="#111111" stroke-width="3" marker-end="url(#ak)"/>
<text x="440" y="164" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">HOURS</text>
<circle cx="90" cy="180" r="22" fill="#F2EFE6" stroke="#111111" stroke-width="4"/>
<text x="90" y="228" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">UNSIGNED</text>
<text x="90" y="244" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">built by import</text>
<circle cx="230" cy="180" r="22" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="230" y="228" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">SIGNED</text>
<text x="230" y="244" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">by the hardware key</text>
<circle cx="370" cy="180" r="22" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="370" y="228" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">STAMPED</text>
<text x="370" y="244" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">sent to calendars</text>
<circle cx="510" cy="180" r="22" fill="#2E7D4F" stroke="#111111" stroke-width="4"/>
<text x="510" y="228" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">UPGRADED</text>
<text x="510" y="244" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">block confirmed</text>
<line x1="538" y1="180" x2="614" y2="102" stroke="#111111" stroke-width="2" marker-end="url(#ak)"/>
<rect x="620" y="80" width="140" height="44" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="3" stroke-dasharray="8 6"/>
<text x="690" y="99" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">DUAL-ANCHORED</text>
<text x="690" y="114" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">proposed</text>
<line x1="538" y1="180" x2="614" y2="154" stroke="#111111" stroke-width="2" marker-end="url(#ak)"/>
<rect x="620" y="132" width="140" height="44" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="3" stroke-dasharray="8 6"/>
<text x="690" y="151" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">RENEWED</text>
<text x="690" y="166" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">planned</text>
<line x1="538" y1="180" x2="614" y2="206" stroke="#111111" stroke-width="2" marker-end="url(#ak)"/>
<rect x="620" y="184" width="140" height="44" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="3" stroke-dasharray="8 6"/>
<text x="690" y="203" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">REPLACED</text>
<text x="690" y="218" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">v2 draft</text>
<line x1="538" y1="180" x2="614" y2="258" stroke="#111111" stroke-width="2" marker-end="url(#ak)"/>
<rect x="620" y="236" width="140" height="44" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="3" stroke-dasharray="8 6"/>
<text x="690" y="255" font-size="9.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">WITHDRAWN</text>
<text x="690" y="270" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">v2 draft</text>
<text x="40" y="306" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Dashed states are not built. The signed form is never changed after signing.</text>
<line x1="40" y1="350" x2="760" y2="350" stroke="#111111" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="376" font-size="13" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Four states are built. Signing takes one touch; confirmation in Bitcoin takes hours.</text>
</svg>
