<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">What A Record Proves</title>
<desc id="d">Five boxes in a row. Four are blue: integrity, attestation, inclusion and existence in time, each with its evidence and its limit beneath. The fifth, custody and description, is empty and is bracketed as declared.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
<rect width="800" height="400" fill="#F2EFE6"/>
<text x="40" y="42" font-size="15" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="3">WHAT A RECORD PROVES</text>
<text x="760" y="42" font-size="12" font-weight="500" text-anchor="end" fill="#111111" letter-spacing="1.5">FIG. 4B</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#111111" stroke-width="3" stroke-linecap="butt"/>
<rect x="40" y="96" width="128" height="64" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="104" y="133" font-size="10.5" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.2">INTEGRITY</text>
<text x="104" y="188" font-size="10.5" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">SHA-256 of the file</text>
<text font-style="italic" x="104" y="205" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">exact bytes only</text>
<rect x="188" y="96" width="128" height="64" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="252" y="133" font-size="10.5" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.2">ATTESTATION</text>
<text x="252" y="188" font-size="10.5" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">Ed25519 signature</text>
<text font-style="italic" x="252" y="205" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">rests on a domain</text>
<rect x="336" y="96" width="128" height="64" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="400" y="133" font-size="10.5" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.2">INCLUSION</text>
<text x="400" y="188" font-size="10.5" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">two Merkle paths</text>
<text font-style="italic" x="400" y="205" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">no limit</text>
<rect x="484" y="96" width="128" height="64" rx="6" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="548" y="125" font-size="10.5" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.2">EXISTENCE</text>
<text x="548" y="141" font-size="10.5" font-weight="700" text-anchor="middle" fill="#F2EFE6" letter-spacing="1.2">IN TIME</text>
<text x="548" y="188" font-size="10.5" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">each anchor</text>
<text font-style="italic" x="548" y="205" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">a lower bound</text>
<rect x="632" y="96" width="128" height="64" rx="6" fill="#F2EFE6" stroke="#111111" stroke-width="4"/>
<text x="696" y="125" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">CUSTODY,</text>
<text x="696" y="141" font-size="10.5" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.2">DESCRIPTION</text>
<text x="696" y="188" font-size="10.5" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">the custodian's word</text>
<text font-style="italic" x="696" y="205" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">not verified</text>
<line x1="40" y1="236" x2="612" y2="236" stroke="#111111" stroke-width="3"/>
<line x1="40" y1="226" x2="40" y2="236" stroke="#111111" stroke-width="3"/>
<line x1="612" y1="226" x2="612" y2="236" stroke="#111111" stroke-width="3"/>
<text x="326" y="262" font-size="11" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">PROVEN BY THE RECORD</text>
<line x1="632" y1="236" x2="760" y2="236" stroke="#111111" stroke-width="3"/>
<line x1="632" y1="226" x2="632" y2="236" stroke="#111111" stroke-width="3"/>
<line x1="760" y1="226" x2="760" y2="236" stroke="#111111" stroke-width="3"/>
<text x="696" y="262" font-size="11" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">DECLARED</text>
<text x="40" y="312" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Not proven: content accuracy, authorship, or the state of the file before it was first hashed.</text>
<line x1="40" y1="350" x2="760" y2="350" stroke="#111111" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="376" font-size="13" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Four claims are proven by the record. Custody history and description are declared.</text>
</svg>
