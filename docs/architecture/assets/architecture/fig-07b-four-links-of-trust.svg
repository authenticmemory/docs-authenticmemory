<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<title id="t">Four Links Of Trust</title>
<desc id="d">Four discs in a row joined by a line: institution, key, record, time. The links are the DID log, the signature and the anchor. A red line drops from the record to a reader, who gets per-check results.</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111" stroke="none"/></marker></defs>
<rect width="800" height="400" fill="#F2EFE6"/>
<text x="40" y="42" font-size="15" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="3">FOUR LINKS OF TRUST</text>
<text x="760" y="42" font-size="12" font-weight="500" text-anchor="end" fill="#111111" letter-spacing="1.5">FIG. 7B</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#111111" stroke-width="3" stroke-linecap="butt"/>
<line x1="110" y1="140" x2="680" y2="140" stroke="#111111" stroke-width="4"/>
<line x1="490" y1="140" x2="490" y2="250" stroke="#D7261E" stroke-width="4"/>
<circle cx="110" cy="140" r="22" fill="#1F4E9C" stroke="#111111" stroke-width="4"/>
<text x="110" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">INSTITUTION</text>
<circle cx="300" cy="140" r="18" fill="#F4D35E" stroke="#111111" stroke-width="4"/>
<text x="300" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">KEY</text>
<circle cx="490" cy="140" r="22" fill="#111111" stroke="#111111" stroke-width="4"/>
<text x="490" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">RECORD</text>
<circle cx="680" cy="140" r="22" fill="#2E7D4F" stroke="#111111" stroke-width="4"/>
<text x="680" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">TIME</text>
<text x="205" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">DID LOG</text>
<text x="205" y="182" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">no witnesses yet</text>
<text x="395" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">SIGNATURE</text>
<text x="395" y="182" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">bound to the batch root</text>
<text x="585" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1.5">ANCHOR</text>
<text x="585" y="182" font-size="10" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="0.3">a second is proposed</text>
<circle cx="490" cy="272" r="22" fill="#F2EFE6" stroke="#111111" stroke-width="4"/>
<text x="526" y="262" font-size="11" font-weight="700" text-anchor="start" fill="#111111" letter-spacing="1.5">READER</text>
<text x="526" y="279" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">gets a result for each check.</text>
<text x="526" y="296" font-size="11" font-weight="400" text-anchor="start" fill="#D7261E" letter-spacing="0.3">The summary ignores key status.</text>
<text x="40" y="262" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Institution to key: a log on its own domain.</text>
<text x="40" y="279" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Key to record: one touch on the hardware.</text>
<text x="40" y="296" font-size="11" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Record to time: a Bitcoin block header.</text>
<line x1="40" y1="350" x2="760" y2="350" stroke="#111111" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="376" font-size="13" font-weight="400" text-anchor="start" fill="#111111" letter-spacing="0.3">Each link has its own control. The link to the reader is the weakest today.</text>
</svg>
